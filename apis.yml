name: Luma Home
description: Luma Home was a smart-home networking startup, backed by Andreessen Horowitz (a16z),
  best known for its Luma whole-home mesh WiFi system that paired consumer routers with mobile-app
  network management, parental controls, and security features. The company was acquired by Newell
  Brands and its product line was subsequently discontinued. It is tracked in the API Evangelist
  network as an a16z portfolio lead. An enrichment pass on 2026-07-20 found no live company website
  and no public developer, documentation, or API surface (candidate domains return HTTP 404), so no
  API artifacts were produced. This profile is retained as a historical company record.
